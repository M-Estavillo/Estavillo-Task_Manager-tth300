<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>Task Manager</h1>
        <nav>
            <a href="index.html" class="active">Dashboard</a>
            <a href="tasks.html">Tasks</a>
            <a href="add-task.html">Add Task</a>
        </nav>
    </header>

    <main class="container">
        <section class="stats">
            <div class="stat-card">
                <h3 id="total-tasks">0</h3>
                <p>Total Tasks</p>
            </div>
            <div class="stat-card">
                <h3 id="todo-count">0</h3>
                <p>To Do</p>
            </div>
            <div class="stat-card">
                <h3 id="inprogress-count">0</h3>
                <p>In Progress</p>
            </div>
            <div class="stat-card">
                <h3 id="done-count">0</h3>
                <p>Done</p>
            </div>
        </section>

        <section class="active-tasks">
            <div class="section-header">
                <h2>Active Tasks</h2>
                <a href="tasks.html" class="btn btn-secondary">View All</a>
            </div>
            <div class="active-task-groups">
                <div class="task-group">
                    <h3>In Progress</h3>
                    <div id="inprogress-tasks-list" class="task-list"></div>
                </div>
                <div class="task-group">
                    <h3>To Do</h3>
                    <div id="todo-tasks-list" class="task-list"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/taskService.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.initDashboard();
        });
    </script>
</body>
</html>
